version: "3"

vars:
  PROJECT_NAME: equitherm-web

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies
    cmds:
      - pnpm install

  dev:
    desc: Start development server
    cmds:
      - pnpm dev

  build:
    desc: Build for production
    cmds:
      - pnpm build

  preview:
    desc: Preview production build
    cmds:
      - pnpm preview

  test:
    desc: Run tests
    cmds:
      - pnpm test

  typecheck:
    desc: Run TypeScript type checking
    cmds:
      - pnpm typecheck

  clean:
    desc: Remove build artifacts and node_modules
    cmds:
      - rm -rf node_modules dist

  ci:
    desc: Run CI checks (install, build, typecheck, test)
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build
      - pnpm typecheck
      - pnpm test
